[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mogrulscraper"
version = "0.0.1"
description = "A multi-domain scraper with a web-ui."
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "requests>=2.34.2",
]
