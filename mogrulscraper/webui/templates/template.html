<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mogrul Scraper</title>

    <link
            rel="icon"
            type="image/svg+xml"
            href="{{ url_for('static', filename='icons/icon_running.svg') }}"
            id="favicon"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/template.css') }}">
</head>

<body>
    <script src="{{ url_for('static', filename='js/template.js') }}"></script>

    <header class="app-header">
        <a href="/" class="logo">
            <img
                src="{{ url_for('static', filename='icons/icon_running.svg') }}"
                alt="Mogrul Scraper logo"
                class="logo-mark"
                id="logo-icon"
            >

            <span>Mogrul Scraper</span>
        </a>

        <a href="/config" class="config-button">
            <span class="config-icon">⚙</span>
            <span>Config</span>
        </a>
    </header>

    <div id="notifications">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div
                    class="notification notification-{{ category }}"
                    data-message="{{ message }}"
                >
                    <span class="notification-message">
                        {{ message }}
                    </span>

                    <button
                        class="notification-close"
                        type="button"
                        aria-label="Close notification"
                    >
                        &times;
                    </button>
                </div>
            {% endfor %}
        {% endwith %}
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
